spring:
  application:
    name: soudan
  autoconfigure:
    exclude:
      # Không dùng tài khoản/mật khẩu mặc định do Boot sinh ra; xác thực do module auth đảm nhiệm.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  modulith:
    events:
      # Email gửi lỗi (ví dụ máy chủ mail tạm sập) được giữ lại và gửi lại khi khởi động lại ứng dụng.
      republish-outstanding-events-on-restart: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  notification:
    from: ${MAIL_FROM:no-reply@soudan.local}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    max-file-size: 10MB
  timezone: Asia/Ho_Chi_Minh
  jwt:
    access-ttl: 15m
    refresh-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
