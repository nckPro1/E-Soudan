spring:
  application:
    name: soudan
  autoconfigure:
    exclude:
      # Không dùng tài khoản/mật khẩu mặc định do Boot sinh ra; xác thực do module auth đảm nhiệm.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  timezone: Asia/Ho_Chi_Minh
  jwt:
    access-ttl: 15m
    refresh-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
