spring:
  application:
    name: soudan
  autoconfigure:
    exclude:
      # Không dùng tài khoản/mật khẩu mặc định do Boot sinh ra; xác thực do module auth đảm nhiệm.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  modulith:
    events:
      # Email gửi lỗi (ví dụ máy chủ mail tạm sập) được giữ lại và gửi lại khi khởi động lại ứng dụng.
      republish-outstanding-events-on-restart: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  notification:
    from: ${MAIL_FROM:no-reply@soudan.local}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    max-file-size: 10MB
  timezone: Asia/Ho_Chi_Minh
  # Nhắc việc và nhắc nộp báo cáo (giờ theo app.timezone). Ngày làm việc phải nộp báo cáo: app.report.work-days.
  # Tài khoản demo cho người xem sản phẩm tự thử nghiệp vụ. TẮT mặc định; chỉ bật ở môi trường demo/dev, không bật ở production.
  # Giờ hoạt động hiện ở trang đăng nhập khi máy chủ bật/tắt theo lịch (chỉ để hiển thị; lịch thật nằm ở hạ tầng, phải khớp).
  # Bật bằng APP_OPERATINGHOURS_ENABLED=true; đổi giờ bằng APP_OPERATINGHOURS_START / _END.
  operating-hours:
    enabled: false
    start: "08:30"
    end: "18:00"
    timezone: Asia/Ho_Chi_Minh
  demo:
    enabled: false
    email: demo@soudan.local
    password: "12345678"
  reminders:
    enabled: true
    task-cron: "0 0 8 * * *"
    report-cron: "0 30 16 * * MON-FRI"
  # Trợ lý AI. Đặt ANTHROPIC_API_KEY để gọi Claude thật; AI_PROVIDER=mock để chạy thử giao diện không gọi ra ngoài.
  ai:
    provider: ${AI_PROVIDER:anthropic}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-5-5}
    # Dùng khi AI_PROVIDER=local: địa chỉ máy chủ mô hình (Ollama mặc định http://localhost:11434) và thời gian chờ
    base-url: ${AI_BASE_URL:https://api.anthropic.com}
    timeout: ${AI_TIMEOUT:60s}
    max-context-chars: ${AI_MAX_CONTEXT_CHARS:24000}
  jwt:
    access-ttl: 15m
    refresh-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
