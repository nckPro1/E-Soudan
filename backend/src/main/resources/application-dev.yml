# Chỉ dùng cục bộ với docker-compose.yml ở thư mục gốc.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/soudan
    username: soudan
    password: soudan
  mail:
    # Mặc định gửi vào MailHog (http://localhost:8025), không ra ngoài. Muốn gửi thật: đặt MAIL_HOST, MAIL_PORT,
    # MAIL_USERNAME, MAIL_PASSWORD (và MAIL_FROM) trong môi trường trước khi chạy; xem docs/SETUP.md.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Có tên đăng nhập thì bật xác thực + STARTTLS (cổng 587), như Gmail/Outlook/SMTP công ty.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

app:
  storage:
    # File nộp lưu ngoài thư mục mã nguồn. Đặt STORAGE_DIR để đổi.
    dir: ${STORAGE_DIR:${user.home}/.soudan/uploads}
  jwt:
    # Chỉ dùng cục bộ. Đặt JWT_SECRET (>= 32 ký tự) để thay thế.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  bootstrap:
    # Admin đầu tiên: đặt cả hai biến môi trường này trước khi chạy lần đầu.
    admin-email: ${ADMIN_EMAIL:}
    admin-temp-password: ${ADMIN_TEMP_PASSWORD:}
